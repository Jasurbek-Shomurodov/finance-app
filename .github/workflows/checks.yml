name: Project checks
on:
  push:
  pull_request:
  # Started by the pictures job after it commits redrawn Linux pictures (a bot's push starts no run by itself).
  workflow_dispatch:
permissions:
  contents: read
# One run per commit at a time: the same commit pushed to its feature branch and then to main waits for the first run,
# and the second finds it passed and skips (the `seen` job).
concurrency:
  group: checks-${{ github.sha }}
  cancel-in-progress: false
jobs:
  seen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count' || echo 0)
          if [ "${count:-0}" -gt 0 ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "CI already passed $GITHUB_SHA; skipping the checks." >> "$GITHUB_STEP_SUMMARY"
            echo passed=true >> "$GITHUB_OUTPUT"
          else
            echo passed=false >> "$GITHUB_OUTPUT"
          fi
  # The quick checks, apart from the tests so a lint or type error shows in two minutes.
  verify:
    needs: seen
    if: needs.seen.outputs.passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on a known high or critical vulnerability in a package the app ships.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:integration
  # Every unit test, in six parts on six machines; each part measures its own coverage and `coverage` adds them up.
  unit:
    needs: seen
    if: needs.seen.outputs.passed != 'true'
    name: unit (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs --coverage --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1
  # The coverage floor and the list of files no test runs yet (scripts/coverage-floor.json), over all six parts.
  coverage:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-shards
      - run: node scripts/test.mjs --check-coverage=coverage-shards
  # The P0 flows and the screenshot tests in a real browser, in three parts: a production build against
  # e2e/fake-supabase.mjs (the app's schema in PGlite), on the fixed workspace in e2e/fixture.mjs. No real account or
  # service is reached. A push to a branch other than main redraws the Linux pictures that changed and `pictures`
  # commits them to the branch; main, pull requests and the run that follows the pictures commit compare strictly.
  e2e:
    needs: seen
    if: needs.seen.outputs.passed != 'true'
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDRAW: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:production
      - run: npx playwright test --shard=${{ matrix.shard }}/3 ${{ env.REDRAW == 'true' && '--update-snapshots=changed' || '' }}
      - name: Collect the redrawn Linux pictures
        if: always() && env.REDRAW == 'true'
        run: |
          git ls-files --modified --others --exclude-standard -- 'e2e/*-snapshots/*-linux.png' | while read -r file; do
            mkdir -p "redrawn/$(dirname "$file")" && cp "$file" "redrawn/$file" && echo "redrawn: $file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.REDRAW == 'true'
        with:
          name: pictures-${{ matrix.shard }}
          path: redrawn/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Commits the pictures the e2e parts redrew to the pushed branch, starts a strict run of that commit and cancels
  # this one.
  pictures:
    needs: [seen, e2e]
    if: ${{ !cancelled() && needs.seen.outputs.passed != 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pictures-*
          merge-multiple: true
          path: ${{ runner.temp }}/redrawn
      - name: Commit the redrawn Linux pictures
        env:
          GH_TOKEN: ${{ github.token }}
          REDRAWN: ${{ runner.temp }}/redrawn
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then echo "The branch moved on; its newer run redraws the pictures."; exit 0; fi
          if [ ! -d "$REDRAWN/e2e" ]; then echo "No Linux picture changed."; exit 0; fi
          cp -R "$REDRAWN/e2e/." e2e/
          git add -- 'e2e/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then echo "No Linux picture changed."; exit 0; fi
          {
            echo "### Linux pictures redrawn by CI"
            git diff --cached --name-only | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "e2e: the Linux pictures for ${GITHUB_SHA::8}" -m "Redrawn by CI run $GITHUB_RUN_ID. Look at them in the diff before this branch goes to main."
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run checks.yml --ref "$GITHUB_REF_NAME"
          # This commit's pictures were stale, so its run must not count as passed (main takes only passed commits);
          # it ends cancelled rather than failed, and the run of the pictures commit decides.
          gh run cancel "$GITHUB_RUN_ID"
          sleep 60

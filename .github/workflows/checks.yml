name: Project checks
on:
  push:
  pull_request:
  # Started by the pictures job after it commits redrawn Linux pictures (a bot's push starts no run by itself).
  workflow_dispatch:
permissions:
  contents: read
# One run per commit at a time: a commit started again waits for the first run to finish.
concurrency:
  group: checks-${{ github.sha }}
  cancel-in-progress: false
# Four jobs: verify, unit, e2e and pictures (which only commits what e2e redrew).
jobs:
  # The quick checks, apart from the tests so a lint or type error shows in two minutes, then the integration test.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on a known high or critical vulnerability in a package the app ships.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      # The integration test starts the production server, so it needs the build.
      - run: npm run build:production
      - run: npm run test:integration
  # Every unit test on one machine, one test file per core, then the coverage floor and the list of files no test runs
  # yet (scripts/coverage-floor.json).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs --coverage --concurrency=$(nproc)
  # The P0 flows and the screenshot tests in a real browser, one at a time: a production build against
  # e2e/fake-supabase.mjs (the app's schema in PGlite), on the fixed workspace in e2e/fixture.mjs. No real account or
  # service is reached. A push redraws the Linux pictures that changed and `pictures` commits them to main (work goes
  # straight to main, no branches); pull requests and the run that follows the pictures commit compare strictly.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REDRAW: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:production
      - run: npx playwright test ${{ env.REDRAW == 'true' && '--update-snapshots=changed' || '' }}
      - name: Collect the redrawn Linux pictures
        if: always() && env.REDRAW == 'true'
        run: |
          git ls-files --modified --others --exclude-standard -- 'e2e/*-snapshots/*-linux.png' | while read -r file; do
            mkdir -p "redrawn/$(dirname "$file")" && cp "$file" "redrawn/$file" && echo "redrawn: $file"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && env.REDRAW == 'true'
        with:
          name: pictures
          path: redrawn/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Commits the pictures e2e redrew to main, starts a strict run of that commit and cancels
  # this one.
  pictures:
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # A pattern, so a run that redrew nothing (and uploaded nothing) finds none instead of failing.
          pattern: pictures*
          merge-multiple: true
          path: ${{ runner.temp }}/redrawn
      - name: Commit the redrawn Linux pictures
        env:
          GH_TOKEN: ${{ github.token }}
          REDRAWN: ${{ runner.temp }}/redrawn
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then echo "The branch moved on; its newer run redraws the pictures."; exit 0; fi
          if [ ! -d "$REDRAWN/e2e" ]; then echo "No Linux picture changed."; exit 0; fi
          cp -R "$REDRAWN/e2e/." e2e/
          git add -- 'e2e/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then echo "No Linux picture changed."; exit 0; fi
          {
            echo "### Linux pictures redrawn by CI"
            git diff --cached --name-only | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "e2e: the Linux pictures for ${GITHUB_SHA::8}" -m "Redrawn by CI run $GITHUB_RUN_ID. Look at them in the diff."
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run checks.yml --ref "$GITHUB_REF_NAME"
          # This commit's pictures were stale, so its run must not count as passed; it ends cancelled rather than failed,
          # and the run of the pictures commit decides.
          gh run cancel "$GITHUB_RUN_ID"
          sleep 60
